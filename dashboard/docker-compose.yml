version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: sentient-elasticsearch
    environment:
      - node.name=sentient-es
      - cluster.name=sentient-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - sentient-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: sentient-logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5001:5000"  # Changed from 5044 to 5001 to avoid conflicts
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch
    networks:
      - sentient-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: sentient-kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - sentient-network

volumes:
  es_data:
    driver: local

networks:
  sentient-network:
    driver: bridge