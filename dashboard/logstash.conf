input {
  http {
    port => 5000
    codec => json
  }
}

filter {
  # Just pass everything through - let's see what we get
  mutate {
    add_field => { "received_from" => "json_monitor" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "sentient-logs-%{+YYYY.MM.dd}"
  }
  stdout { 
    codec => rubydebug 
  }
}